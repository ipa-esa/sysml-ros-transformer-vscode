name: Build & Package SysML ↔ ROS VS Code Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 & GitHub Packages Authentication
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github-rostooling
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Java CLI, Run Tests, and Package VS Code Extension (.vsix)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.ROSTOOLING_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew build vscodeExtension --info

      - name: Upload VS Code Extension (.vsix)
        uses: actions/upload-artifact@v4
        with:
          name: sysml-ros-transformer-vscode
          path: extension/build/vscode/*.vsix
          if-no-files-found: error

      - name: Upload Standalone CLI Fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: sysml-ros-transformer-cli
          path: transformer-cli/build/libs/sysml-ros-transformer-cli-*.jar
          if-no-files-found: error
